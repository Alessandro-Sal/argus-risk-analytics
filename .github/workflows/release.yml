name: Build & Release ARGUS Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable & Package ZIP
        run: |
          python scripts/package_release.py

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ARGUS_*.zip
          name: ARGUS Risk Analytics ${{ github.ref_name }} — Institutional Production Release
          tag_name: ${{ github.ref_name }}
          overwrite: true
          make_latest: true
          body: |
            # 👁️ ARGUS Risk Analytics & Wealth Platform — Production Release v6.0.0

            Benvenuti nella release ufficiale di **ARGUS v6.0.0**, l'ecosistema integrato di **Quantitative Risk Management, Portfolio BI, BQuant Analytics, Wealth Management & Personal Finance Intelligence**.

            ---

            ### 📦 Download Archivio Release (Zero-Setup)
            * **File**: `ARGUS_v6.0.0.zip`
            * **Compatibilità**: Windows 10 / 11 (64-bit), macOS, Linux
            * **Caratteristiche**:
              * ⚡ **Zero-Setup**: Nessuna necessità di configurare database esterni.
              * 🖥️ **Interfaccia Web & Desktop Native**: Rendering fluido a 21 moduli con Navigation Rail istituzionale.
              * 💾 **Persistenza & Caching**: Dual-Engine (SQLite locale & MySQL 8.0/DuckDB) con crittografia end-to-end.

            ---

            ### ✨ Novità Principali & Moduli Inclusi (21 Moduli)

            #### 🏛️ Sezione 1: Quantitative Risk & Portfolio BI (Moduli 0 - 11)
            1. **🎛️ Control Room & Master Portfolio Hub**: Ingestione dati multi-formato (CSV, DeGiro, Google Sheets Live Sync), consolidamento Master Portfolio e anagrafica ISIN/Ticker.
            2. **📈 Dashboard Performance & NAV**: Rendimento cumulato, TWRR, MWRR, Rolling Sharpe/Sortino, Underwater Drawdown e Benchmark Overlay dinamico.
            3. **🖥️ Live Terminal & Market Desk**: Streaming tape in tempo reale, L2 Depth Book, watchlist, Bloomberg CLI Console interattiva e OMS Blotter.
            4. **🔴 Analisi Rischio**: VaR Parametrico/Storico/Cornish-Fisher, CVaR 95%/99%, Stress Test Storici (Lehman, Covid, 1970s), Regime Switching e GARCH(1,1).
            5. **🔬 Modelli Quantitativi**: Black-Litterman, HRP (Hierarchical Risk Parity), Equal Risk Contribution (ERC), Kelly Criterion, Tail Copulas Asimmetriche (Clayton/Gumbel) e Black-Scholes Delta-Hedging.
            6. **📋 Posizioni & Dettagli**: Visualizzazione granulare posizioni, Marginal VaR, Component VaR, liquidità Days-to-Liquidate e cluster di correlazione.
            7. **🏛️ Valutazione Aziendale & Forensic**: Beneish M-Score, Altman Z-Score, Sloan Accrual Ratio, DuPont 5-Factor, Piotroski F-Score e DCF Monte Carlo.
            8. **⚖️ Ottimizzazione Portafoglio**: Frontiera Efficiente di Markowitz, Max Sharpe, Min Volatilità e What-If Rebalancing Sandbox in tempo reale.
            9. **📊 Analisi Temporale**: Matrice di correlazione dinamica, stagionalità mensile/annuale, scomposizione rolling e test di stazionarietà.
            10. **📈 Analisi Tecnica**: Volume Profile (POC, Value Area 70%), Confluence Score, Chandelier Exit, RSI/MACD/Bollinger e Pre-Trade Impact Simulator.
            11. **🔍 Screener Opportunità**: Screening multi-asset fondamentale e quantitativo su mercati globali.
            12. **💻 BQuant & Launchpad**: Terminale quantitativo in stile Bloomberg con script editor Python, backtesting engine e automazione API.

            #### 💎 Sezione 2: Wealth Management & Personal Finance Ecosystem (Moduli 12 - 21)
            13. **🎛️ Wealth Control Room**: Centro di comando patrimoniale, gestione multi-conto, sincronizzazione Google Sheets e Master Diagnostics.
            14. **🏛️ Patrimonio & Net Worth**: Consolidamento patrimoniale a 5 livelli (Liquidità, Titoli, Caveau, Previdenza, Immobili), Wealth Health Score e Trend Storico.
            15. **💳 Cash Flow & Spese**: Libro mastro entrate/uscite, Budgeting 50/30/20, Subscription Sentinel con calcolo Opportunity Drag e Rolling Cashflow Forecast probabilistico.
            16. **⌚ Asset Illiquidi & Orologi**: Caveau metalli preziosi (Oro 18K/24K, Argento) e collezione orologi di lusso con tracking rivalutazione e matrici di liquidabilità.
            17. **🛡️ Previdenza & Pension Planning**: Simulazione Monte Carlo fondo pensione, rivalutazione TFR (1.5% + 75% FOI), gap previdenziale e calcolo rendita netta.
            18. **🔥 Indipendenza Finanziaria & FIRE**: Calcolatore Standard/Lean/Fat/Coast FIRE, Dynamic Safe Withdrawal Rate (SWR), Ponte Wealth ⇄ Risk con Fondo Anti-Forced Selling e Goal-Based 3-Bucket Allocator.
            19. **📑 Fiscalità & Quadro RW**: Calcolo plusvalenze/minusvalenze, monitoraggio zainetto fiscale quadriennale, modulo Tax-Loss Harvesting, Quadro RW e IVAFE/Bollo IT.
            20. **🏡 Immobili & Mutui**: Piani di ammortamento francese/italiano, ROI/Cap Rate immobiliare, simulatore mutuo a tasso fisso/variabile e Buy vs Rent Analyzer.
            21. **⚖️ Pianificazione Successoria**: Analisi asse ereditario, quote di legittima e disponibile, imposte di successione e donazione con franchigie e Trust/Holding planner.
            22. **🤖 AI Copilot & Wealth Advisor**: Assistente IA generativo (Gemini / OpenAI / Fallback Deterministico Locale) per report patrimoniali istituzionali, diagnosi automatica e Q&A di bilancio.

            ---

            ### 🧪 Validazione & Affidabilità
            * **Test Suite PyTest**: **34/34 Test Superati con Successo (100% Pass Rate)**
            * **Linter (Ruff)**: **0 Errori**
            * **Privacy & Sicurezza**: **Zero-Cloud Leak**, crittografia e isolamento credenziali certificato.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
