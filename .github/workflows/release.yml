name: Build & Release ARGUS Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable & Package ZIP
        run: |
          python scripts/package_release.py ${{ github.ref_name }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          name: ARGUS Risk Analytics ${{ github.ref_name }} — Institutional Production Release
          tag_name: ${{ github.ref_name }}
          overwrite: true
          make_latest: true
          body: |
            # 🏛️ ARGUS Risk Analytics & Wealth Platform — ${{ github.ref_name }}
            ## Tier-1 Institutional Strategic Transformation Release (BlackRock Aladdin, Bloomberg AIM, MSCI Barra Standards)

            Benvenuti nella release ufficiale di **ARGUS ${{ github.ref_name }}**, l'ecosistema integrato ad altissima densità analitica che unifica **Quantitative Risk Management, Multi-Asset Factor Risk, Wealth Planning, Bilancio Personale CFP, Tri-Agent Governance Council & Conic Rebalancing**.

            ---

            ### 📦 Download Archivio Release (Zero-Setup)
            * **File**: `ARGUS_${{ github.ref_name }}.zip`
            * **Compatibilità**: Windows 10 / 11 (64-bit), macOS, Linux
            * **Caratteristiche**:
              * ⚡ **Zero-Setup**: Nessuna necessità di configurare database esterni; avvio immediato con SQLite / DuckDB locale integrato.
              * 🖥️ **Interfaccia Web & Desktop Native**: Rendering fluido a 22 moduli con Navigation Rail istituzionale, layout responsivo e Dark Mode glassmorphic.
              * 💾 **Universal One-Ledger**: Doppio motore a partita doppia con estrazione Zero-Copy su buffer `PyArrow` e partizionamento Parquet.

            ---

            ### 🚀 Principali Innovazioni della Release Tier-1

            #### 🏛️ 1. Universal One-Ledger Core (`core/universal_ledger.py`)
            * **Single Source of Truth**: Superamento definitivo dei silos informativi tra portafoglio titoli liquido e patrimonio complessivo (immobili, caveau metalli preziosi, orologi, polizze, partecipazioni).
            * **Star Schema Immutabile**: Schemi analitici `dim_entity`, `dim_asset_master`, `fact_ledger_entry`.
            * **Calcolo WACP / FIFO Analitico**: Risoluzione ad alta velocità dei lotti d'acquisto e prezzi di carico tramite costrutti analitici DuckDB SQL (`QUALIFY ROW_NUMBER() OVER ...`).

            #### 🌐 2. Human Capital & Total Balance Sheet VaR (`core/wealth/human_capital_engine.py`)
            * **Modello Attuariale Nelson-Siegel**: Attualizzazione stocastica dei redditi da lavoro futuri con curva dei tassi sovrani e premio al rischio settoriale.
            * **Scomposizione Sintetica Quasi-Equity / Quasi-Bond**: Riconoscimento del Beta di mercato del capitale umano.
            * **Total Balance Sheet VaR & CVaR 95%**: Matrice di covarianza allargata $3 \times 3$ (Portafoglio Liquido, Real Estate, Capitale Umano).
            * **Emergency Runway & Catastrophic Correlation Trap**: Calcolo dei mesi di sopravvivenza a stipendio azzerato e rilevamento del rischio di concentrazione reddito-portafoglio.

            #### ⚖️ 3. Prescriptive Conic Rebalancer & FIX Protocol 4.4 (`core/prescriptive_rebalancer.py`)
            * **Ottimizzazione Vincolata Convessa/SLSQP**: Minimizzazione congiunta di Tracking Error, Turnover, Market Impact Almgren-Chriss e Carico Fiscale.
            * **Tax-Loss Harvesting & Minusvalenze TUIR**: Compensazione attiva dello zainetto fiscale quadriennale (aliquote 26% / 12.5%).
            * **Institutional Execution Blotter**: Generazione di ordini conformi allo standard internazionale **FIX Protocol 4.4** (`35=D`, `54=Side`, `38=Qty`, `44=LimitPx`, `59=TIF`, `10=Checksum`).

            #### 🏛️ 4. Tri-Agent Quantitative Governance Council (`core/ai_analyst.py`)
            * **Consiglio Multi-Agente Autonomo**: Tre auditor specializzati (`QuantRiskAuditor`, `TaxEfficiencySpecialist`, `MacroExecutionStrategist`).
            * **Score di Governance Ponderato**: Valutazione collegiale (/100) con matrice di delibera formale e verbale di conformità MiFID II / CONSOB.

            #### 🔬 5. Decomposizione Rischio MSCI Barra & Teorema di Eulero (`core/msci_barra_risk_engine.py`)
            * **Modello Strutturale Fattoriale**: $\Sigma = X F X^T + \Delta$ con separazione esatta tra Rischio Sistemico e Rischio Specifico.
            * **Teorema di Eulero**: Calcolo analitico di MCTR e PCTR per asset e per fattore di stile con quadratura esatta $\sum \text{PCTR}_i = 100.0\%$.
            * **Active Style Factor Tilts & Scenari**: Radar chart delle esposizioni attive rispetto al benchmark e stress test multi-scenario (Tech Selloff, Stagflazione, Momentum Reversal, Flight to Quality).

            #### 🎲 6. Lifetime Total Balance Sheet Monte Carlo Engine (`core/wealth/tbs_monte_carlo.py`)
            * **Simulatore Stocastico Olistico**: 5.000 traiettorie correlate per l'intero ciclo di vita (fino a 95 anni).
            * **Lifetime Ruin Probability & Fragility Point**: Individuazione del punto di massima vulnerabilità finanziaria in fase di decumulazione.
            * **Safe Spending Corridor**: Corridoio di prelievo annuale sostenibile al 95° percentile di confidenza.

            ---

            ### 🧪 Validazione & Certificazione Qualità
            * **Test Suite PyTest**: **597/597 Test Superati con Successo (100% Pass Rate)**
            * **Linter CI (Ruff)**: **0 Errori (`ruff check --select E9,F63,F7,F82 .`)**
            * **Resilienza Cross-Platform**: Convalidato su Ubuntu Linux, Windows e macOS.
            * **Sicurezza**: Audit rigoroso anti-leak credenziali e isolamento locale dei dati.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
