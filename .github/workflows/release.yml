name: Build & Release ARGUS Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable & Package ZIP
        run: |
          python scripts/package_release.py

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ARGUS_Desktop_v5.0.zip
          name: ARGUS Risk Analytics ${{ github.ref_name }} — Standalone Desktop
          body: |
            # 👁️ ARGUS Risk Analytics Platform — Automatic Release
            
            - 🖥️ **Standalone Desktop App**: `ARGUS.exe` pronto all'uso.
            - ⚡ **Zero Setup**: Scarica, estrai lo zip ed avvia senza installare Python o dipendenze.
            - 📊 **Risk Engine & BI Integration**: Piattaforma completa di Risk Analytics e Business Intelligence.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
