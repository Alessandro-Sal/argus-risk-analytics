name: Build & Release ARGUS Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable & Package ZIP
        run: |
          python scripts/package_release.py

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ARGUS_v5.5.0.zip
          name: ARGUS Risk Analytics ${{ github.ref_name }} — Institutional Production Release
          tag_name: ${{ github.ref_name }}
          overwrite: true
          make_latest: true
          body: |
            # 👁️ ARGUS Risk Analytics Platform — Production Release v5.5.0

            Benvenuti nella release ufficiale di **ARGUS v5.5.0**, la piattaforma avanzata di **Business Intelligence, Financial Valuation, AI Narrative Intelligence, Forensic Accounting e Quantitative Risk Management**.

            ---

            ### 📦 Download Archivio Release (Zero-Setup)
            * **File**: `ARGUS_v5.5.0.zip`
            * **Compatibilità**: Windows 10 / 11 (64-bit), macOS, Linux
            * **Caratteristiche**:
              * ⚡ **Zero-Setup**: Nessuna necessità di configurare database esterni.
              * 🖥️ **Interfaccia Web & Desktop Native**: Rendering fluido ad alte prestazioni.
              * 💾 **Persistenza & Caching**: Database SQLite locale e cache intelligente per schermare rate-limit API.

            ---

            ### ✨ Novità Principali & Moduli Inclusi (10 Moduli)

            1. **🎛️ Control Room & Total Wealth Hub**:
               * Ingestione dati multi-formato (CSV, DeGiro, Google Sheets Live Sync), consolidamento Master Portfolio e **Gestione Anagrafica ISIN / Ticker DB (`asset_mapping`)**.
            2. **🧠 ARGUS AI Analyst & Quant Copilot**:
               * Generazione automatica di Executive Memorandum narrativi in 4 sezioni (Gemini / OpenAI API / NLG Deterministico Offline 100%) e assistente interattivo integrato per interrogare il portafoglio.
            3. **🧬 Modelli Quantitativi di Frontiera**:
               * *Tail Copulas Asimmetriche (Clayton & Gumbel)* per il rischio di crash congiunto non lineare, *Criterio di Kelly & Half-Kelly Position Sizing* e *Equal Risk Contribution (ERC / Risk Parity Pura)*.
            4. **🗂️ Total Wealth Hub (Multi-Account)**:
               * Gestione e salvataggio profili multi-conto (*Crescita*, *Dividendi*, *Previdenza*), scorecard comparativa affiancata e consolidamento automatico in Master Wealth Portfolio.
            5. **🔍 Spotlight Command Palette (`Ctrl+K`)**:
               * Ricerca globale istantanea su tutti i 10 moduli, oltre 30 sottomoduli, ticker di portafoglio e scorciatoie di sistema.
            6. **🧪 Live Rebalancing Sandbox (What-If Weight Matrix)**:
               * Simulatore di ribilanciamento in tempo reale con slider e 5 preset quantitativi (*Pesi Attuali*, *Equipesato*, *Max Sharpe*, *Min Volatilità*, *Equal Risk ERC*).
            7. **📊 Dynamic Multi-Benchmark Overlay & Scorecard**:
               * Confronto simultaneo fino a 4 benchmark personalizzati (SPY, QQQ, ACWI, AGG, GLD, BTC) con tabella analitica comparativa.
            8. **🔬 Ottimizzazione & Coperture Black-Scholes**:
               * *Hierarchical Risk Parity (HRP)* con Tree Clustering ML, *Black-Scholes (1973)* con 5 Greci e Delta-Hedging con opzioni Put, *Merton Jump-Diffusion*, e *Market Regime Switching*.
            9. **🕵️‍♂️ Contabilità Forense & Diagnostica Bilanci**:
               * *Beneish M-Score (1999)* a 8 indici, *Sloan Accrual Ratio*, *Altman Z-Score*, *DuPont 5-Factor*, *Piotroski F-Score (9pt)* e *DCF Monte Carlo*.
            10. **📈 Analisi Tecnica & Screener con Pre-Trade Simulator**:
                * *Volume Profile* (Point of Control POC, Value Area 70%), *Technical Confluence Score*, e simulatore dell'impatto pre-trade prima dell'esecuzione.

            ---

            ### 🧪 Validazione & Affidabilità
            * **Test Suite PyTest**: **100% Test Superati**
            * **Linter (Ruff)**: **0 Errori**
            * **Dataset Reale**: Validato su portafogli multi-asset reali con gestione FX multi-valuta (EUR/USD/GBP/CHF).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
