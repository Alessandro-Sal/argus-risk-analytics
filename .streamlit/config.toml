[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxMessageSize = 500
fileWatcherType = "none"
folderWatchBlacklist = ["data", "logs", "exports", "cache"]

[theme]
base = "dark"
primaryColor = "#ff9900"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"
