services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_DB_HOST=db
      - STREAMLIT_DB_PORT=3306
      - STREAMLIT_DB_USER=root
      - STREAMLIT_DB_PASS=root
      - STREAMLIT_DB_NAME=investment_risk_bi
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_DB_HOST=db
      - STREAMLIT_DB_PORT=3306
      - STREAMLIT_DB_USER=root
      - STREAMLIT_DB_PASS=root
      - STREAMLIT_DB_NAME=investment_risk_bi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=investment_risk_bi
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/DB.sql:/docker-entrypoint-initdb.d/01_DB.sql:ro
      - ./scripts/DB_wealth.sql:/docker-entrypoint-initdb.d/02_DB_wealth.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
