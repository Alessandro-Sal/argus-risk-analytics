[pytest]
minversion = 7.4
addopts = -v --tb=short -p no:warnings
testpaths = tests
pythonpath = .
markers =
    smoke: Smoke test rapidi di compilazione ed esecuzione pagine Streamlit
    quant: Test numerici analitici a tolleranza fissa (pytest.approx) sui motori di calcolo
    wealth: Test su contabilità patrimoniale, conservazione debito mutui e lotti FIFO
    snapshot: Test di regressione numerica su DataFrame golden reference
